text: Beim Erzeugen von FHIR-Ressourcen im FHIR Data Service MUSS dieser jede zu speichernde
  Ressource gegen das dazugehörige aktuelle Profil validieren. Die Information, gegen
  welches Profil in welcher Version geprüft wurde, MUSS der FHIR Data Service in der
  jeweiligen Ressource in <i>Meta.profile</i> speichern.
