text: Der FHIR Data Service MUSS für jede zurückgegebene Ressource die zugehörigen
  Ressourcen gemäß den Verknüpfungskriterien ermitteln und mit <i>entry.search.mode
  = "include"</i> in die Antwort aufnehmen. Falls eine referenzierte Ressource nicht
  existiert, nicht gefunden wird oder nicht abrufbar ist, DARF KEIN Fehler zurückgegeben
  werden.
title: Verarbeitung von referenzierten Ressourcen in Include-Suchen
