text: Wenn eine Anforderung vom Client-System verlangt, Inhalte einer oder mehrerer
  Instanzen von FHIR-Profilen des FHIR Data Service anzuzeigen, die das Client-System
  implementiert, muss das entsprechende Client-System alle Must-Support-Elemente für
  die menschliche Nutzung anzeigen. Es muss dabei nicht jeden Wert genauso darstellen,
  wie er in der Instanz kodiert ist, darf aber auch keine wesentlichen Informationen
  ausblenden.
title: Anzeige für Must Support
