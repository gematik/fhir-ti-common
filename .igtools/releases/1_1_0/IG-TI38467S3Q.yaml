text: Ein FHIR Data Service MUSS an dem Endpunkt /metadata gemäß der [Capabilities-Interaktion]
  ein Capability Statement Typ <i>kind = instance</i> bereitstellen. Dieses Capability
  Statement muss im Element <i>software</i> den Namen und die Versionsnummer der eingesetzten
  Software angeben. Dieses Capability Statement muss sämtliche Anforderungen an den
  FHIR Data Service aus dem Capability Statement vom Typ <i>kind = requirements</i>
  der zugrundeliegenden Spezifikation erfüllen.
title: Bereitstellung des /metadata-Endpunkts durch FHIR Data Service
version: 1
