text: "Der FHIR Data Service MUSS bei einem HTTP GET-Request auf eine spezifische\
  \ Version einer FHIR-Instanz den HTTP Status Code <i>404 (Not Found)</i> zurückgeben,\
  \ wenn die angeforderte Version nicht existiert.\n <br/><br/>\n Die Response MUSS\
  \ eine <i>OperationOutcome</i>-Ressource enthalten mit folgenden Eigenschaften:\n\
  \ <ul>\n <li><i>OperationOutcome.issue.code</i> auf <i>not-found</i> gesetzt.</li>\n\
  \ <li><i>OperationOutcome.issue.diagnostics</i> mit einer Meldung, dass die angeforderte\
  \ Version nicht existiert.</li>\n </ul>"
title: 404 Not Found Antwort für nicht existierende spezifische Versionen
version: 0
