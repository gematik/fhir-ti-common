text: Ein Client-System, das schreibend ein FHIR-Profil des FHIR Data Service implementiert,
  MUSS jedes als Must Support gekennzeichnete Element gemäß der dazugehörigen Kardinalitätsangabe
  befüllen. Das heißt auch, dass in optionalen Elementen (z.B. Kardinalität "0..1",
  "0..*") der Elementwert leer bleiben darf, sofern dem Client-System kein Wert zur
  Verfügung steht.
title: Befüllungspflicht für Must Support
version: 2
