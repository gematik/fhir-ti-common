text: "Der FHIR Data Service MUSS, sofern die entsprechende Schnittstelle ein FHIR-Format\
  \ zurückgibt, das Format <i>application/fhir+json</i> verwenden, wenn in der Anfragenachricht\
  \ kein unterstütztes Format durch den <i>_format</i>-Parameter, und\n <ul>\n <li>kein\
  \ <i>Accept</i> Header,</li>\n <li>oder durch den <i>Accept</i> Header keine eindeutige\
  \ Präferenz eines unterstützten Formats</li>\n </ul>\n angegeben ist."
