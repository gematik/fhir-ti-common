text: Der FHIR Data Service MUSS den <i>Accept</i>-Header in eingehenden HTTP-Anfragen
  auswerten, um das gewünschte Antwortformat zu bestimmen. Der FHIR Data Service MUSS
  die Formate <i>application/fhir+json</i> und <i>application/fhir+xml</i> im <i>Accept</i>Header
  unterstützen und die jeweilige HTTP-Antwortnachricht in dem Format zurückgeben,
  das von den beiden Formaten als bevorzugte Option angegeben wurde.
title: Unterstützung des Accept Header für Formatwahl im FHIR Data Service
version: 1
