text: Der FHIR Data Service MUSS numerische und datumsbasierte Suchparameter so verarbeiten,
  dass die Suchwerte entsprechend ihrer Präzision interpretiert werden. Beispielsweise
  muss eine Suche nach 2025-02-11 den Bereich von 2025-02-11T00:00:00 (inklusive)
  bis 2025-02-12T00:00:00 (exklusive) abdecken.
title: Unterstützung der Präzision bei numerischen und datumsbasierten Suchparametern
