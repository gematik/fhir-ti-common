text: "Der FHIR Data Service MUSS den <i>Accept</i>-Header in eingehenden HTTP-Anfragen\
  \ auswerten, um das gewünschte Antwortformat zu bestimmen. Der FHIR Data Service\
  \ MUSS die Formate <i>application/fhir+json</i> und <i>application/fhir+xml</i>\
  \ im <i>Accept</i>Header unterstützen und die jeweilige HTTP-Antwortnachricht in\
  \ dem angegebenen Format verarbeiten.\n    <br/><br/>\n    <ul>\n        <li>Wenn\
  \ der Accept Header auf <i>application/fhir+json</i> gesetzt ist, MUSS die Antwort\
  \ in diesem Format erfolgen.</li>\n        <li>Wenn der Accept Header auf <i>application/fhir+xml</i>\
  \ gesetzt ist, MUSS die Antwort in diesem Format erfolgen.</li>\n    </ul>"
title: Unterstützung des Accept Header für Formatwahl im FHIR Data Service
version: 1
