text: Der FHIR Data Service MUSS das Lesen spezifischer Versionen von FHIR-Instanzen
  gemäß der HL7 FHIR Spezifikation [FHIR Version Read] implementieren. Dabei MUSS
  eine angeforderte Version einer Instanz über eine <i>GET</i>-Anfrage der Form <i>[base]/[resourceType]/[id]/_history/[versionId]</i>
  bereitgestellt werden. Die Antwort MUSS die angeforderte Version der Instanz enthalten,
  einschließlich der zugehörigen Metadaten (<i>meta.versionId</i>, <i>meta.lastUpdated</i>).
title: Abruf einer spezifischen Ressourcenversion über die FHIR API
version: 1
