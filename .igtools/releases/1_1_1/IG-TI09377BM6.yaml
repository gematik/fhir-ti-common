text: Das Client-System, das lesend ein FHIR-Profil des FHIR Data Service implementiert,
  MUSS in der Lage sein, alle Must-Support-Elemente in FHIR-Instanzen zu verarbeiten.
  Das Client-System MUSS auch Must-Support-Elemente ohne Wert verarbeiten können,
  ohne mit einem Fehler abzubrechen oder die Anwendung abstürzen zu lassen.
