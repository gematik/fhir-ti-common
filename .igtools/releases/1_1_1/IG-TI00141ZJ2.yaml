text: Der FHIR Data Service MUSS bei der Sortierung von Instanzen anhand des Datentyps
  <i>Period</i> nach dem Element <i>Period.start</i> sortieren. Sofern zwei Instanzen
  den gleichen <i>start</i>-Wert besitzen muss sofern vorhanden weitergehend nach
  <i>Period.end</i> sortiert werden. Falls zwei Instanzen nach diesen Regeln den gleichen
  Sortierrang besitzen oder sowohl für <i>Period.start</i> als auch <i>Period.end</i>
  kein Wert gesetzt ist, muss sofern nicht anders angegeben nach <i>Resource.meta.lastUpdated</i>
  der Instanz sortiert werden.
title: Sortierung des Datentyps Period
