text: Falls sowohl der <i>Accept</i>-Header als auch der <i>_format</i>-Parameter
  in einer Anfragenachricht angegeben sind, MUSS der FHIR Data Service den <i>_format</i>-Parameter
  priorisieren und das Antwortformat entsprechend diesem verarbeiten. Der <i>Accept</i>
  Header MUSS in diesem Fall ignoriert werden.
title: Vorrang des _format-Parameters gegenüber dem Accept Header
