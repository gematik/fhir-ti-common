text: Der FHIR Data Service MUSS das Registrieren und Speichern von neuen Daten ablehnen
  und mit dem Fehler <i>SVC_INACTIVE_CODE</i> quittieren, falls ein Code den Status
  <i>inactive</i> besitzt. Unter <i>OperationOutcome.issue.diagnostics</i> MUSS der
  FHIR Data Service angeben, welcher Code nicht mehr unterstützt wird.
