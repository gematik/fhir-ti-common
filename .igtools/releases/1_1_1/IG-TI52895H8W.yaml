text: Der FHIR Data Service MUSS sicherstellen, dass bei einer Aktualisierung einer
  FHIR-Instanz, die keine inhaltlichen Änderungen an den bestehenden Werten vornimmt,
  die aktuelle Version unverändert bleibt. In diesem Fall wird keine neue Version
  erstellt und die bestehende <i>Meta.versionId</i> sowie das <i>Meta.lastUpdated-Datum</i>
  bleiben erhalten.
title: Keine neue Version bei inhaltsgleichen Aktualisierungen
