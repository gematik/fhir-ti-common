text: "Der FHIR Data Service MUSS innerhalb des <i>_history</i> Bundle auch gelöschte\
  \ Versionen einer FHIR-Instanz dokumentieren.\n    <br/><br/>\n    <ul>\n      \
  \  <li>Das <i>entry.request</i>-Element MUSS die Methode (<i>method = DELETE</i>)\
  \ und die URL (<i>url</i>) enthalten.</li>\n        <li>Das <i>entry.response</i>-Element\
  \ MUSS den Status (status = 200 OK) sowie das Löschdatum (<i>lastModified</i>) enthalten.</li>\n\
  \        <li>Das <i>entry.resource</i>-Element DARF für die gelöschte Version NICHT\
  \ enthalten sein</li>\n    </ul>"
title: Bundle.entry.request und Bundle.entry.response innerhalb des _history-Bundles
  bei gelöschten FHIR-Instanzen
