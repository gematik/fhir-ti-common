text: "Der FHIR Data Service MUSS bei einem <i>GET</i>-Request auf eine gelöschte\
  \ FHIR-Instanz oder eine gelöschte Version den HTTP Status Code <i>410 (Gone)</i>\
  \ zurückgeben.\n    <br/><br/>\n    Dies gilt für:\n    <ul>\n        <li><i>[ResourceType]/[id]</i>\
  \ – wenn die gesamte FHIR-Instanz gelöscht wurde</li>\n        <li><i>[ResourceType]/[id]/_history/[versionId]</i>\
  \ – wenn eine spezifische Version der FHIR-Instanz gelöscht wurde</li>\n    </ul>\n\
  \    <br/>\n    Die Response MUSS eine <i>OperationOutcome</i>-Ressource enthalten\
  \ mit folgenden Eigenschaften:\n    <ul>\n        <li><i>OperationOutcome.issue.code</i>\
  \ ist auf <i>processing</i> gesetzt</li>\n        <li><i>OperationOutcome.issue.details</i>\
  \ ist auf <i>MSG_DELETED</i> gesetzt</li>\n        <li><i>OperationOutcome.issue.diagnostics</i>\
  \ enthält eine Meldung, dass die Instanz gelöscht wurde</li>\n    </ul>"
title: HTTP 410 Gone für den Abruf einer gelöschten FHIR-Instanz
version: 2
