text: "Der FHIR Data Service MUSS für die Validierung von Dosierungen prüfen, ob der\
  \ in\n <ul>\n <li>MedicationRequest.extension:renderedDosageInstruction</li>\n <li>MedicationDispense.extension:renderedDosageInstruction</li>\n\
  \ <li>MedicationStatement.extension:renderedDosageInstruction</li>\n </ul>\nangegebene\
  \ String den Vorgaben der Validierung von strukturierten Dosierungen entspricht\
  \ und andernfalls die Operation mit dem HTTP Status Code 400 und einer Fehlermeldung\
  \ inklusive erwarteter textueller Repräsentation abbrechen."
title: Strukturierte Dosierung - Validierung der generierten Dosierungsangabe
