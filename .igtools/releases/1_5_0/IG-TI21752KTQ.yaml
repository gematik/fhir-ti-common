text: Der FHIR Data Service MUSS bei erfolgreichen <i>read</i>-, <i>vread</i>-, <i>create</i>-
  und <i>update</i>-Interaktionen den HTTP-Antwortheader <i>ETag</i> zurückgeben.
  Der Header enthält die <i>Meta.versionId</i> der jeweiligen FHIR-Instanz als schwachen
  ETag im Format <i>W/"&lt;versionId&gt;"</i>, beispielsweise <i>W/"2"</i>.
title: ETag in HTTP-Antworten auf FHIR-Interaktionen
version: 0
