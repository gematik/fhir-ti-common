text: Der FHIR Data Service MUSS bei der Sortierung von Instanzen anhand des Datentyps
  <i>Period</i> nach dem Element <i>Period.start</i> sortieren. Sofern zwei Instanzen
  den gleichen <i>start</i>-Wert besitzen, muss, sofern vorhanden, weitergehend nach
  <i>Period.end</i> sortiert werden. Ein nicht angegebener <i>Period.start</i>-Wert
  oder <i>Period.end</i>-Wert ist hierbei als noch nicht gestartet, also negativ unendlich,
  bzw. offen, also unendlich anzusehen.
title: Sortierung des Datentyps Period
version: 1
