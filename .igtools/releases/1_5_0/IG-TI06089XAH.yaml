text: Wenn eine Anforderung vom Client-System verlangt, Inhalte einer oder mehrerer
  Instanzen von FHIR-Profilen des FHIR Data Service anzuzeigen, die das Client-System
  implementiert, MUSS das Client-System die als Must Support gekennzeichneten Elemente
  für die menschliche Nutzung anzeigen. Elemente, die ausschließlich der technischen
  Verarbeitung dienen (z. B. <i>Coding.system</i>, <i>Coding.version</i>, <i>Identifier.system</i>,
  Extension-URLs und <i>meta</i>), sind von der Anzeigepflicht ausgenommen. Der jeweilige
  Fach-IG kann den Anzeigeumfang festlegen oder einschränken. Die Werte dürfen in
  einer für Menschen verständlichen Form dargestellt werden.
title: Anzeige für Must Support
version: 1
