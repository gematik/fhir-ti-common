text: Das Client-System MUSS die Must-Support-Elemente eines von ihm implementierten
  FHIR-Profils für die jeweilige Zielgruppe verständlich anzeigen, wenn eine Anforderung
  die Anzeige der Inhalte verlangt. Rein technische Elemente wie <i>Coding.system</i>,
  <i>Coding.version</i>, <i>Identifier.system</i>, Extension-URLs und <i>meta</i>
  sind von der Anzeigepflicht ausgenommen. Der jeweilige Fach-IG kann Anzeigeumfang
  und Darstellungsform festlegen oder einschränken.
title: Anzeige für Must Support
version: 1
