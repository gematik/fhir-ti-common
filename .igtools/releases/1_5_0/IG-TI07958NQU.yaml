text: Der FHIR Data Service MUSS eine <i>update</i>-Anfrage ohne den HTTP-Header <i>If-Match</i>
  mit HTTP <i>400 Bad Request</i> ablehnen, wenn er für den betroffenen Ressourcentyp
  im CapabilityStatement den Wert <i>versioned-update</i> angibt.
