text: "Der FHIR Data Service MUSS eine schreibende Anfrage (z.B. eine FHIR-Operation,\
  \ eine <i>create</i>-, <i>update</i>- oder <i>delete</i>-Interaktion oder ein Bundle\
  \ vom Typ <i>transaction</i>) vollständig ablehnen, wenn ihre Verarbeitung zu mindestens\
  \ einer hängenden Referenz führen würde. Bei einem Bundle vom Typ <i>batch</i> gilt\
  \ dies je Eintrag.\n <br/><br/>\n In diesem Fall MUSS der FHIR Data Service den\
  \ Datenbestand unverändert lassen, d.h. alle durch die Anfrage bewirkten Änderungen\
  \ verwerfen, und mit dem HTTP Status Code <i>409 (Conflict)</i> antworten. Die Response\
  \ MUSS eine <i>OperationOutcome</i>-Ressource enthalten, die je hängender Referenz\
  \ ein <i>issue</i> mit folgenden Eigenschaften enthält:\n <ul>\n <li><i>OperationOutcome.issue.code</i>\
  \ ist auf <i>conflict</i> gesetzt</li>\n <li><i>OperationOutcome.issue.details</i>\
  \ ist auf <i>SVC_DANGLING_REFERENCE</i> gesetzt</li>\n <li><i>OperationOutcome.issue.diagnostics</i>\
  \ benennt die referenzierende FHIR-Instanz, das referenzierende Element und den\
  \ Wert der nicht auflösbaren Referenz</li>\n </ul>"
title: Ablehnung schreibender Anfragen bei Entstehen hängender Referenzen
version: 0
