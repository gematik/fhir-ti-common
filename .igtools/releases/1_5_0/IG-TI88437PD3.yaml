text: "Der FHIR Data Service MUSS bei der Prüfung auf hängende Referenzen ausschließlich\
  \ solche hängenden Referenzen berücksichtigen, die durch die Anfrage entstehen.\
  \ Dies sind:\n <ul>\n <li>literale Referenzen, die durch die Anfrage hinzugefügt\
  \ oder geändert werden und nicht auflösbar sind, sowie</li>\n <li>literale Referenzen\
  \ in nach der Verarbeitung aktuellen, nicht gelöschten FHIR-Instanzen, die vor der\
  \ Verarbeitung auflösbar waren und durch die Anfrage (z.B. durch Löschen der referenzierten\
  \ FHIR-Instanz) nicht mehr auflösbar sind.</li>\n </ul>\n Der FHIR Data Service\
  \ MUSS bereits vor der Verarbeitung bestehende hängende Referenzen bei der Prüfung\
  \ unberücksichtigt lassen, sodass diese nicht zur Ablehnung der Anfrage führen.\
  \ Dies gilt auch, wenn sie in einer durch die Anfrage aktualisierten FHIR-Instanz\
  \ unverändert erhalten bleiben. Die Prüfung MUSS anhand des Gesamtergebnisses der\
  \ Anfrage erfolgen, sodass z.B. das Löschen einer referenzierenden und der von ihr\
  \ referenzierten FHIR-Instanz innerhalb derselben Anfrage zulässig ist."
title: Berücksichtigung ausschließlich durch die Anfrage entstehender hängender Referenzen
version: 0
