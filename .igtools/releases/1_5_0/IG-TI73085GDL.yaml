text: Der FHIR Data Service MUSS lesende Anfragen (z.B. <i>read</i>, <i>vread</i>,
  <i>search</i>, <i>history</i> oder lesende FHIR-Operationen) auch dann erfolgreich
  beantworten, wenn die zurückzugebenden FHIR-Instanzen hängende Referenzen enthalten.
  Hängende Referenzen MÜSSEN dabei unverändert zurückgegeben werden. Ist das Ziel
  einer über <i>_include</i> angeforderten Referenz nicht auflösbar, MUSS der FHIR
  Data Service die Anfrage ohne die entsprechende FHIR-Instanz beantworten.
title: Keine Fehler durch hängende Referenzen bei lesenden Anfragen
version: 0
