text: Der FHIR Data Service MUSS sicherstellen, dass bei jeder Aktualisierung einer
  FHIR-Instanz, die deren Inhalt ändert, die <i>Meta.versionId</i> angepasst wird.
  Das Element <i>Meta.lastUpdated</i> MUSS dabei auf den Zeitpunkt der Aktualisierung
  gesetzt werden.
title: Aktualisierung von Meta.versionId und Meta.lastUpdated bei einer Änderung
version: 1
