text: "Der FHIR Data Service MUSS in den Interaktionen <i>history-instance</i> und\
  \ <i>history-type</i> den FHIR-Suchparameter <i>_at</i> gemäß [FHIR History Interaction]\
  \ verarbeiten. Der Wert von <i>_at</i> wird dabei als vollständiges Datum (YYYY-MM-DD)\
  \ oder als <i>dateTime</i> mit Uhrzeit einschließlich Sekunden und Zeitzone (z.\
  \ B. YYYY-MM-DDThh:mm:ss+zz:zz) erwartet und nach seiner Präzision ausgelegt.<br/>\n\
  \ Das Ergebnis MUSS auf diejenigen Versionen eingeschränkt werden, die zum angegebenen\
  \ Zeitpunkt oder, bei einem Datum, im Laufe dieses Tages gültig waren. Das Ergebnis\
  \ MUSS dabei ebenfalls als FHIR-<i>Bundle</i> mit <i>Bundle.type = history</i> zurückgegeben\
  \ werden.<br/>\n Bei einem Wert von <i>_at</i>, der keinem dieser beiden Formate\
  \ entspricht, MUSS der FHIR Data Service mit einem HTTP Status Code <code>400</code>\
  \ <i>\"Bad Request\"</i> sowie einer <i>OperationOutcome</i>-Ressource und Wert\
  \ <i>MSG_BAD_SYNTAX</i> im Element <i>.issue.details.coding.code</i> antworten."
title: Zeitpunktbezogener Abruf der Versionshistorie mit _at
version: 0
