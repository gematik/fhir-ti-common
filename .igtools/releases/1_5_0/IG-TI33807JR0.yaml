text: Das Client-System MUSS den ersten verfügbaren Anzeigetext verwenden, wenn eine
  Anforderung die Anzeige codierter Must-Support-Elemente eines von ihm implementierten
  FHIR-Profils verlangt. Die Quellen sind in dieser Reihenfolge auszuwerten <i>CodeableConcept.text</i>,
  <i>Coding.display</i>, Anzeigetext des Codes aus dem zugehörigen CodeSystem im Terminologiepaket.
  Fehlt ein Anzeigetext aus allen drei Quellen, zeigt das Client-System einen Hinweis
  an, dass der Wert nicht als Text verfügbar ist.
title: Anzeigetexte für codierte Must-Support-Elemente
