text: 'Der FHIR Data Service MUSS sicherstellen, dass die <i>versionId</i> einer FHIR-Instanz
  bei jeder neuen Version um genau 1 erhöht wird. Die erste Version einer FHIR-Instanz
  erhält die <i>versionId</i> 1, die nächste Version 2, und so weiter. Beispiel: 1
  → 2 → 3 →'
