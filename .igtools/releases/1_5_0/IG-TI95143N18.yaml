text: Der FHIR Data Service MUSS sicherstellen, dass relative Referenzen - wie <i>literal</i>-Referenzen
  in der Form [Resourcetyp]/[ResourceId] - nicht im Feld <i>Bundle.entry.fullUrl</i>
  verwendet werden. Alle Verweise auf Ressourcen innerhalb des FHIR Data Service MÜSSEN
  entweder als absolute URLs oder als UUID-basierte URIs (urn:uuid) angegeben werden.
title: Formatierung von Referenzen im fullUrl-Feld
