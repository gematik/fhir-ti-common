text: "Der FHIR Data Service MUSS innerhalb des <i>_history</i> Bundle auch gelöschte\
  \ Versionen einer FHIR-Instanz dokumentieren.\n <br/><br/>\n Für gelöschte Versionen\
  \ gilt:\n <ul>\n <li>Bei gelöschten Ressourceinstanzen wird das Element <i>Bundle.entry.resource</i>\
  \ nicht ausgegeben.</li>\n <li><i>Bundle.entry.request.method</i> hat für gelöschte\
  \ Ressourceinstanzen den Wert <i>DELETE</i>.</li>\n <li><i>Bundle.entry.request.url</i>\
  \ enthält die REST-äquivalente Ressourcen-URL relativ zum FHIR-Endpunkt, <i>ResourceType/{id}</i>.</li>\n\
  \ <li><i>Bundle.entry.response.status</i> enthält den Wert <i>200 OK</i>.</li>\n\
  \ <li><i>Bundle.entry.response.lastModified</i> enthält das Löschdatum der Ressourceinstanz.</li>\n\
  \ </ul>"
title: Repräsentation gelöschter Versionen in Bundle.entry.request und Bundle.entry.response
  innerhalb eines _history-Bundles
version: 1
