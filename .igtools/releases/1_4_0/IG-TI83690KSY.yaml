text: "Der FHIR Data Service MUSS für die Validierung von Dosierungen die Angaben\
  \ von Version und Sprache unter\n <ul>\n <li>MedicationRequest.extension.generatedDosageInstructionsMeta</li>\n\
  \ <li>MedicationDispense.extension.generatedDosageInstructionsMeta</li>\n <li>MedicationStatement.extension.generatedDosageInstructionsMeta</li>\n\
  \ </ul>\n mit dem aktuellen Implementierungsstand vergleichen und bei Abweichungen\
  \ die Operation mit dem HTTP-Fehlercode 400 und einer Fehlermeldung inklusive implementierter\
  \ Version und Sprache abbrechen."
title: Strukturierte Dosierung - Validierung von Version und Sprache
