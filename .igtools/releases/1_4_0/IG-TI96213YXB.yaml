text: 'Der FHIR Data Service MUSS für die Validierung von Dosierungen prüfen, ob der
  in


  - `MedicationRequest.extension:renderedDosageInstruction` oder

  - `MedicationDispense.extension:renderedDosageInstruction`


  angegebene String den Vorgaben der Validierung von strukturierten Dosierungen entspricht
  und andernfalls die Operation mit dem HTTP-Fehlercode 400 und einer Fehlermeldung
  inklusive erwarteter textueller Repräsentation abbrechen.'
title: Strukturierte Dosierung - Validierung der generierten Dosierungsangabe
version: 0
