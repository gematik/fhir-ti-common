text: Der FHIR Data Service MUSS sicherstellen, dass das <i>fullUrl</i>-Feld in jedem
  <i>Entry</i> (<i>Bundle.entry.fullUrl</i>) wie in der Standard HL7 FHIR Spezifikation
  als absolute URL oder als UUID-basierte URI (urn:uuid) angegeben wird. Relative
  Pfade sind im <i>fullUrl</i>-Feld nicht zulässig. Für absolute URLs gilt zusätzlich,
  dass sie das Format <i>[base]/[Ressourcentyp]/[ResourceId]</i> aufweisen müssen.
title: Formatierungsvorgaben für das fullUrl-Feld in FHIR-Bundles
