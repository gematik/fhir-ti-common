text: Der FHIR Data Service MUSS sicherstellen, dass Suchoperationen für Felder mit
  Ganzzahlen (<i>integer</i>) nur exakte numerische Übereinstimmungen liefern und
  keine Präzisionsanpassungen wie bei Gleitkommazahlen (<i>decimal</i>, <i>quantity</i>)
  vornehmen.
