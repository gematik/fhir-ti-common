text: Der FHIR Data Service MUSS sicherstellen, dass relative Referenzen wie "literal"
  Referenzen in der Form [Resourcetyp]/[ResourceId] NICHT im Feld <i>Bundle.entry.fullUrl</i>
  verwendet werden. Alle Verweise auf Ressourcen innerhalb des Aktensystems MÜSSEN
  entweder als absolute URLs oder als UUID-basierte URIs (urn:uuid) angegeben werden.
