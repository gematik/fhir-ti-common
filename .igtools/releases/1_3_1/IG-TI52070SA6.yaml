text: "Der FHIR Data Service MUSS innerhalb des <i>_history</i> <i>Bundle</i> für\
  \ jede Version einer FHIR-Instanz die zugehörigen <i>entry.request</i>- und <i>entry.response</i>-Elemente\
  \ bereitstellen.\n <br/><br/>\n <ul>\n <li>\n <i>Bundle.entry.request.method</i>\
  \ gibt die HTTP-äquivalente Aktion an, die zur Entstehung der jeweiligen Version\
  \ der Ressourceinstanz geführt hat. <i>POST</i> für das Anlegen, <i>PUT</i> für\
  \ eine Aktualisierung, <i>DELETE</i> für das Löschen der Ressourceinstanz.\n </li>\n\
  \ <li>\n <i>Bundle.entry.request.url</i> enthält die äquivalente Ressourcen-URL\
  \ relativ zum FHIR-Endpunkt, aus der die versionsspezifische Abruf-URL <i>ResourceType/{id}/_history/{versionId}</i>\
  \ abgeleitet werden kann.\n </li>\n <li>\n <i>Bundle.entry.response.status</i> enthält\
  \ den HTTP-ähnlichen Status der internen Verarbeitung (z. B. <i>201 Created</i>\
  \ oder <i>200 OK</i>).\n </li>\n <li>\n <i>Bundle.entry.response.lastModified</i>\
  \ gibt das Datum und die Uhrzeit der letzten Änderung der jeweiligen Version der\
  \ Ressourceinstanz an und stimmt mit <i>meta.lastUpdated</i> überein, sofern <i>Bundle.entry.resource</i>\
  \ vorhanden ist.\n </li>\n <li>\n <i>Bundle.entry.response.location</i> enthält\
  \ die vollständige versionsspezifische Ressourcen-URL (z. B. <i>ResourceType/{id}/_history/{versionId}</i>),\
  \ sofern die entsprechende Version der Ressourceinstanz einzeln abrufbar ist.\n\
  \ </li>\n </ul>"
title: Bundle.entry.request und Bundle.entry.response innerhalb des _history Bundles
version: 1
