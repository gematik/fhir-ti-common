  path: query-api-search.html
  release: 1.0.1
  release_status: NEW
  source: input/pagecontent/query-api-search.md
  status: ACTIVE
  text: Der FHIR Data Service MUSS sicherstellen, dass Ressourcen, die durch <i>_include</i>
    oder <i>_revinclude</i> in das Suchergebnis aufgenommen werden, stets auf derselben
    Ergebnisseite wie die zugehörigen Suchtreffer (<i>entry.search.mode = "match"</i>)
    enthalten sind.
  title: Einbeziehung verknüpfter Ressourcen auf derselben Ergebnisseite
  version: 1
- actor:
  - EPA-Audit-Service
  - EPA-Medication-Service
  conformance: SHALL
  created: '2025-02-26T12:59:25.679584'
