  path: query-api-search.html
  release: 1.0.1
  release_status: STABLE
  source: input/pagecontent/query-api-search.md
  status: ACTIVE
  text: Der FHIR Data Service MUSS sicherstellen, dass, wenn im <i>Bundle.entry.fullUrl</i>
    eine UUID-basierte URI (<i>urn:uuid</i>) verwendet wird, alle Referenzen innerhalb
    desselben Bundles ebenfalls in der Form <i>urn:uuid:[UUID]</i> angegeben werden.
    Eine Mischung aus absoluten URLs, UUID-basierten URIs und relativen Referenzen
    innerhalb eines Bundles DARF NICHT verwendet werden.
  title: Konsistente Referenzierung innerhalb eines Bundles
  version: 1
